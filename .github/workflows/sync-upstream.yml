name: Sync upstream

on:
  schedule:
    # Run daily at 09:00 UTC
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/p0deje/Maccy.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Check for upstream changes
        id: check
        run: |
          # Find the merge base (last upstream commit we're based on)
          BASE=$(git merge-base HEAD upstream/master)
          if [ "$BASE" = "$(git rev-parse upstream/master)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date with upstream."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Upstream has new commits."
          fi

      - name: Rebase master onto upstream
        if: steps.check.outputs.changed == 'true'
        run: |
          if ! git rebase upstream/master; then
            git rebase --abort || true
            # Fail the run so GitHub sends a failure notification instead of
            # silently skipping releases until someone notices.
            echo "::error::Rebasing the fork onto upstream hit conflicts. Rebase locally, resolve them, and push master."
            exit 1
          fi
          git push origin master --force-with-lease

      - name: Tag and build a release
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT=$(grep -m1 "MARKETING_VERSION" Maccy.xcodeproj/project.pbxproj | sed 's/.*= *//;s/;.*//')
          if [ -z "$SHORT" ]; then
            echo "::error::Could not read MARKETING_VERSION"
            exit 1
          fi

          # The fork keeps its own build number, one higher than the last release tag,
          # so every upstream change ships even when upstream's version is unchanged.
          LAST=$(git tag -l 'v*-custom' | sed -nE 's/^v.*-([0-9]+)-custom$/\1/p' | sort -n | tail -1)
          TAG="v${SHORT}-$(( ${LAST:-0} + 1 ))-custom"

          echo "Creating tag $TAG"
          git tag "$TAG"
          git push origin "$TAG"

          # Tags pushed with GITHUB_TOKEN don't trigger workflows, so start the
          # build (sign, notarize, release, update appcast-custom.xml) directly.
          gh workflow run build.yml --ref "$TAG"
